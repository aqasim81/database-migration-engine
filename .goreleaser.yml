# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# pg_query_go is C (CGO), so every target needs a C toolchain for that target.
# This config must run on macOS (see .github/workflows/release.yml):
#   - darwin builds use Apple clang natively. They need the macOS SDK
#     (libresolv, CoreFoundation, Security), which is why they can't be
#     cross-compiled from Linux.
#   - the linux build cross-compiles with zig against musl, producing a fully
#     static binary with no glibc version requirement. Requires zig on PATH.

before:
  hooks:
    - go mod tidy

builds:
  - id: darwin
    main: ./cmd/migrate
    binary: migrate
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
    goos:
      - darwin
    goarch:
      - arm64
      - amd64

  - id: linux
    main: ./cmd/migrate
    binary: migrate
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-musl
    ldflags:
      # zig's linker ignores Go's -s; strip via the external linker too.
      - -s -w -extldflags=-s
    goos:
      - linux
    goarch:
      - amd64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: aqasim81
    name: database-migration-engine
  draft: false
  prerelease: auto
