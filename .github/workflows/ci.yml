name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Mirrors the lefthook gates (pre-commit: fmt, vet, lint; pre-push: race tests,
  # coverage threshold). `make audit` is the single source of truth, including
  # the coverage exclusion list, so CI and local hooks cannot drift apart.
  checks:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          go install mvdan.cc/gofumpt@latest

      - name: make audit
        run: make audit

  # Kept separate: needs Docker (testcontainers) and is not part of pre-push.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make test-integration
        run: make test-integration
