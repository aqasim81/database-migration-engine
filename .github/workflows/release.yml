name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run the release on PRs that could break it, so problems surface
  # before a tag is pushed rather than after.
  pull_request:
    paths:
      - .goreleaser.yml
      - .github/workflows/release.yml
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'Release' || 'Release (snapshot)' }}
    # macOS: darwin builds need the macOS SDK; linux is cross-built with zig.
    # See the header of .goreleaser.yml.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ github.event_name == 'push' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
