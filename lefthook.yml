pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: gofumpt -l -w {staged_files}
      stage_fixed: true

    goimports:
      glob: "*.go"
      run: '$(go env GOPATH)/bin/goimports -local github.com/aqasim81/database-migration-engine -w {staged_files}'
      stage_fixed: true

    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true

    govet:
      glob: "*.go"
      run: CGO_ENABLED=1 go vet ./...

    go-mod-tidy:
      run: go mod tidy
      stage_fixed: true

    gitleaks:
      # gitleaks from PATH (brew install gitleaks), not a hardcoded GOPATH location
      run: gitleaks git --staged --no-banner

pre-push:
  commands:
    tests:
      run: CGO_ENABLED=1 go test -race -count=1 ./internal/...

    coverage-check:
      # Threshold and exclusion list live only in the Makefile (COVERAGE_MIN, COVERAGE_EXCLUDE),
      # the same target CI runs via `make audit`, so hooks and CI cannot drift apart.
      run: make coverage-check
